name: Unpack site
on:
  push:
    paths: ['site.zip', '.github/workflows/unpack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repo
        run: |
          if [ ! -f site.zip ]; then echo "nothing to unpack"; exit 0; fi
          unzip -o site.zip
          git rm -q site.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site"
          git push
